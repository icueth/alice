[package]
name = "alice-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Embedding providers for Alice"

[features]
default = ["local"]
local = ["dep:ort", "dep:spm_precompiled"]

[dependencies]
alice-core = { path = "../alice-core" }
ort = { workspace = true, optional = true }
spm_precompiled = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest.workspace = true
rustls.workspace = true
futures.workspace = true
sha2.workspace = true
hex.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
chrono.workspace = true
# Equivalence tests only (tests/onnx_equivalence.rs): the M1 embedder the vectors are checked against.
fastembed.workspace = true
