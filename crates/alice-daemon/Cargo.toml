[package]
name = "alice-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Alice daemon: single-writer store, workers, HTTP API and MCP server"

[features]
default = []
# The OS keychain as a secrets backend (`secrets.backend = "keychain"`); the `alice` binary
# enables it. Tests never touch the real keychain: they use an in-memory stand-in.
keychain = ["dep:keyring"]

[dependencies]
keyring = { workspace = true, optional = true }
toml.workspace = true
alice-core = { path = "../alice-core" }
alice-embed = { path = "../alice-embed" }
axum.workspace = true
tokio-util.workspace = true
getrandom.workspace = true
hmac.workspace = true
sha2.workspace = true
anyhow.workspace = true
hex.workspace = true
reqwest.workspace = true
futures.workspace = true
tokio.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
dirs.workspace = true
rmcp.workspace = true
url.workspace = true
schemars.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
