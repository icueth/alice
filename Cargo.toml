[workspace]
resolver = "3"
members = ["crates/alice-core", "crates/alice-embed"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/icueth/alice"
rust-version = "1.99"
authors = ["icueth and Alice contributors"]

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ulid = "3.0.0"
sha2 = "0.11.1"
hex = "0.4.3"
unicode-normalization = "0.1.25"
regex = "1.13.1"
parking_lot = "0.12.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing = "0.1.44"
tempfile = "3.27.0"
half = "2.7.1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs", "io-util"] }
fastembed = { version = "7.1.1", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures = "0.3.34"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
